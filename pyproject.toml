[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathvqa-qwen2vl-finetune"
version = "0.1.0"
description = "Fine-tune Qwen2-VL-7B on PathVQA dataset"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
    "peft>=0.7.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "trl>=0.7.0",
    "pillow>=10.0.0",
    "qwen-vl-utils>=0.0.8",
]

[tool.setuptools]
py-modules = ["dataset", "model", "collate", "train", "inference"]
